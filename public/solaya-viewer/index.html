<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover' />
        <meta charset="utf-8">
        <style>
        body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        }

        #viewer-container {
        position: relative;
        width: 100%;
        height: 100%;
        }

        #application {
            display: block;
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Canvas behind buttons */
        }

        
        .bottom-left-buttons {
            position: absolute;
            bottom: 0px;
            left: 0px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .bottom-right-buttons {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .top-right-buttons {
            position: absolute;
            top: 0px;
            right: 0px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }


        .icon-button {
            width: 72px;
            height: 72px;
            background: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-button path {
            transition: fill 0.3s ease;
        }

        /*.icon-button:hover path[fill="#454545"] {
            fill: #3498FF; 
        }*/
        
        .icon-button:hover path[stroke="black"] {
            stroke: #3498FF;
        }
        .bottom-right-buttons a:hover {
            cursor: pointer;
        }



        /*.icon-button svg {
        width: 20px;
        height: 20px;
        fill: white;
        }*/
        </style>
        <script src="playcanvas-stable.min.js"></script>
    </head>
    <body>
            <div id="viewer-container">

            <canvas id='application'></canvas>

            <!-- Debug controls -->
            <div id="debug-controls" style="
                position: absolute; bottom: 10px; left: 10px; z-index: 100;
                background: rgba(0,0,0,0.75); color: #fff; padding: 12px 16px;
                border-radius: 8px; font-family: monospace; font-size: 12px;
                display: flex; flex-direction: column; gap: 8px; min-width: 260px;
            ">
                <div style="display:flex; justify-content:space-between;"><span>Distance</span><span id="val-dist">-</span></div>
                <input type="range" id="ctrl-dist" min="1" max="60" step="0.5" style="width:100%">
                <div style="display:flex; justify-content:space-between;"><span>FOV</span><span id="val-fov">-</span></div>
                <input type="range" id="ctrl-fov" min="2" max="60" step="0.5" style="width:100%">
                <div style="display:flex; justify-content:space-between;"><span>Yaw</span><span id="val-yaw">-</span></div>
                <input type="range" id="ctrl-yaw" min="-180" max="180" step="1" style="width:100%">
                <div style="display:flex; justify-content:space-between;"><span>Pitch</span><span id="val-pitch">-</span></div>
                <input type="range" id="ctrl-pitch" min="-90" max="90" step="1" style="width:100%">
                <div style="display:flex; justify-content:space-between;"><span>Zoom Factor</span><span id="val-zoom">-</span></div>
                <input type="range" id="ctrl-zoom" min="0.5" max="3" step="0.05" value="1.5" style="width:100%">
            </div>
            <script>
            window.addEventListener('viewerBackgroundChanged', () => {
                const app = pc.app || pc.Application.getApplication();
                if (!app) return;
                const cam = app.root.findByName('Camera');
                if (!cam || !cam.script || !cam.script.orbitCamera) return;
                const oc = cam.script.orbitCamera;
                const els = {
                    d: document.getElementById('ctrl-dist'), f: document.getElementById('ctrl-fov'),
                    y: document.getElementById('ctrl-yaw'), p: document.getElementById('ctrl-pitch'),
                    z: document.getElementById('ctrl-zoom')
                };
                els.d.value = oc._distance; els.f.value = cam.camera.fov;
                els.y.value = oc._yaw; els.p.value = oc._pitch;
                function upd() {
                    document.getElementById('val-dist').textContent = oc._distance.toFixed(1);
                    document.getElementById('val-fov').textContent = cam.camera.fov.toFixed(1);
                    document.getElementById('val-yaw').textContent = oc._yaw.toFixed(1);
                    document.getElementById('val-pitch').textContent = oc._pitch.toFixed(1);
                    document.getElementById('val-zoom').textContent = els.z.value;
                    // Sync slider positions to actual values
                    if (!els.d.matches(':active')) els.d.value = oc._distance;
                    if (!els.f.matches(':active')) els.f.value = cam.camera.fov;
                    if (!els.y.matches(':active')) els.y.value = oc._yaw;
                    if (!els.p.matches(':active')) els.p.value = oc._pitch;
                }
                function apply() { oc._removeInertia(); oc._updatePosition(); if(!oc.autoRender) app.renderNextFrame=true; }
                els.d.oninput = (e) => { oc.distance=+e.target.value; apply(); };
                els.f.oninput = (e) => { cam.camera.fov=+e.target.value; if(!oc.autoRender) app.renderNextFrame=true; };
                els.y.oninput = (e) => { oc.yaw=+e.target.value; apply(); };
                els.p.oninput = (e) => { oc.pitch=+e.target.value; apply(); };
                els.z.oninput = (e) => {
                    // Re-run focus with custom zoom factor
                    const gsEnt = app.root.findByName('GaussianSplatting');
                    if (gsEnt) {
                        oc._buildAabb(gsEnt, 0);
                        var he = oc._modelsAabb.halfExtents;
                        var dist = Math.max(he.x, Math.max(he.y, he.z));
                        dist = (dist / Math.tan(0.5 * cam.camera.fov * Math.PI / 180)) * 2 * +e.target.value;
                        oc.distance = dist;
                        apply();
                    }
                };
                setInterval(upd, 200);
            });
            </script>

            </div>

            <div class="bottom-right-buttons" style="display: none;">
            </div>
        
        <!-- <script src="main.js"></script> -->
        <script type="module" src="main.js"></script>
        <script>

            function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
            }


        function toggleFullscreen() {
            if (isIOS()) {
                // // send postMessage to parent
                // const viewerUrl = window.location.href;
                // const containerId = getUrlParam('containerId');

                // window.top.postMessage(
                // {
                //     action: "openViewer",
                //     containerId: containerId,
                //     data: { viewerUrl: viewerUrl,
                //             suppressFullscreen: true
                //     }
                // },
                // "*" // For production, I should use the exact origin of the parent site
                
                // );
                const urlParam = new URL(document.location).searchParams.get("splatUrl");
                const full = new URL(document.location).searchParams.get("full");
                const previewImage = new URL(document.location).searchParams.get("previewImgUrl");
                const initialAngle = new URL(document.location).searchParams.get("initialAngle");
                console.log("document.location:", document.location);
                window.open(`https://prod-viewer.solaya-app.com/?splatUrl=${urlParam}&full=${full}&previewImgUrl=${previewImage}&initialAngle=${initialAngle || 0}&autoLoad=true`);
                console.log("ios");

            } else {
                // Normal fullscreen logic for other devices
                const viewer = document.getElementById('viewer-container');
                const fullscreenIcon = document.getElementById('fullscreen-icon');
                const exitFullscreenIcon = document.getElementById('exit-fullscreen-icon');

                if (!document.fullscreenElement) {
                viewer.requestFullscreen().then(() => {
                    fullscreenIcon.style.display = 'none';
                    exitFullscreenIcon.style.display = 'block';
                });
                } else {
                document.exitFullscreen().then(() => {
                    fullscreenIcon.style.display = 'block';
                    exitFullscreenIcon.style.display = 'none';
                });
                }
            }
            }

            function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            }

            function showFullscreen(){
                const fullscreenIcon = document.getElementById('fullscreen-icon');
                const exitFullscreenIcon = document.getElementById('exit-fullscreen-icon');
                const botton1 = document.getElementById('botton');
                
                botton1.style.display = 'block';
                fullscreenIcon.style.display = 'block';
                exitFullscreenIcon.style.display = 'none';


                document.addEventListener('fullscreenchange', () => {
                const fullscreenIcon = document.getElementById('fullscreen-icon');
                const exitFullscreenIcon = document.getElementById('exit-fullscreen-icon');
                
                if (!document.fullscreenElement) {
                    fullscreenIcon.style.display = 'block';
                    exitFullscreenIcon.style.display = 'none';
                } else {
                    fullscreenIcon.style.display = 'none';
                    exitFullscreenIcon.style.display = 'block';
                }
                });
            }

            function hexToRgb(hex) {
                
                hex = hex.replace(/^#/, '');

                // Parse r, g, b
                let bigint = parseInt(hex, 16);
                let r = (bigint >> 16) & 255;
                let g = (bigint >> 8) & 255;
                let b = bigint & 255;

                // scaled 0-1
                return { r: r / 255, g: g / 255, b: b / 255 };
            }

            function isLightColor(color) {
                var r = color.r * 255;
                var g = color.g * 255;
                var b = color.b * 255;

                var luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                return luminance > 150;
            }

            // Get the color string from URL param
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const colorHex = urlParams.get('color') || "#FCFBFB";
            const colorRGB = hexToRgb(colorHex);
            const isLight = isLightColor(colorRGB);

            const svgPath = document.querySelector('.bottom-right-buttons svg path');



            window.addEventListener('viewerBackgroundChanged', (e) => {

            if (svgPath) {
                if (isLight) {
                    svgPath.setAttribute('fill', '#454545');
                } else {
                    svgPath.setAttribute('fill', '#F7F5F4');
                }
            }


            let fullscreenControlEnabled = true; 
            //let fullscreenCheckTimeout;

            if (fullscreenControlEnabled) {
                showFullscreen();
            }
            
            // // Wait for possible postMessage to disable the button
            // fullscreenCheckTimeout = setTimeout(() => {
            // if (fullscreenControlEnabled) {
            //     showFullscreen();
            // }
            // }, 200); // wait 200ms for postMessage
            
            window.addEventListener('message', (event) => {
            const message = event.data;

            if (message?.action === 'disableFullscreenButton') {
            const buttonWrapper = document.getElementById('botton');
            if (buttonWrapper) {
                buttonWrapper.style.display = 'none';
            }
            // window.parent.postMessage('FullscreenBtnDisabled', event.origin);
            // console.log("Fullsceen is disabled, post message should stop")
            // clearTimeout(fullscreenCheckTimeout);
        
            }
            });




        });



        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
